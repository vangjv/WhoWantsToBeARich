<!-- Admin Panel Component Template -->
<!-- T061: Walk Away button with Material Design -->
<mat-card class="admin-card">
  <mat-card-header>
    <mat-card-title>Admin Controls</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="controls-container">
      <!-- T061: Walk Away Button -->
      <button
        mat-raised-button
        color="warn"
        class="walk-away-btn"
        [disabled]="walkAwayDisabled"
        (click)="onWalkAway()"
        [attr.aria-label]="'Walk away from current question'"
      >
        <mat-icon>exit_to_app</mat-icon>
        <span>Walk Away</span>
      </button>

      <!-- Status indicator when disabled -->
      <div class="status-hint" *ngIf="walkAwayDisabled">
        <small *ngIf="currentPhase === 'SETUP'">Start a question to enable Walk Away</small>
        <small *ngIf="currentPhase === 'FINAL_LOCKED' || currentPhase === 'REVEAL'">Cannot walk away after locking answer</small>
        <small *ngIf="currentPhase === 'ENDED'">Game has ended</small>
      </div>
    </div>
  </mat-card-content>
</mat-card>
